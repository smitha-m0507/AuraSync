# AuraSync FastAPI Backend
#
# Asynchronous Multi-Agent Audio-to-Visual Compiling Engine.
#
# This service replaces the placeholder Node.js backend with a real pipeline:
#   1. Subscription validation (free vs. premium duration limits)
#   2. Audio ingestion (format / duration / corruption validation + chunking)
#   3. Whisper transcription (parallel chunked for long audio)
#   4. LangGraph parallel multi-agent analysis (Flow / Metric / Validation)
#   5. Mermaid flowchart-or-mindmap generation (auto-chosen, validated)
#   6. Plotly dashboard generation (auto-chosen charts)
#   7. Polling-based job result delivery matching the existing React UI contract
#
# The frontend is unchanged; it speaks the same JSON envelope
# { success, data, error } and the same /api/v1 route shape.

[project]
name = "aurasync-backend-py"
version = "1.0.0"
description = "AuraSync FastAPI backend - Multi-Agent Audio-to-Visual Compiling Engine"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "python-multipart==0.0.12",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.2.0",
    "motor==3.5.1",
    "openai-whisper==20240930",
    "langgraph==0.2.34",
    "langchain-core==0.3.15",
    "httpx==0.27.2",
    "numpy==1.26.4",
    "soundfile==0.12.1",
    "pydub==0.25.1",
    "pillow==10.4.0",
    "cairosvg>=2.7.0",
    "reportlab>=4.0.0",
    "svgwrite>=1.4.3",
    "rapidfuzz==3.10.0",
    "python-dotenv==1.0.1",
]

[project.scripts]
aurasync = "app.main:run"

[tool.setuptools]
packages = ["app"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
